# Installed as /etc/containers/containers.conf by install.sh; applies to every rootless Podman user.
[containers]
dns_servers = ["1.1.1.1", "9.9.9.9"]   # public DNS for orbs, not the host's resolvers
pids_limit = 4096

[network]
pasta_options = ["--map-guest-addr", "none"]   # orbs don't reach the host through 169.254.1.2
